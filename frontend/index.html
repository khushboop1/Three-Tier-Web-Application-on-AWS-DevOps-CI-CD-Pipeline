<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.4rem; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    li.done span { text-decoration: line-through; opacity: .6; }
    li span { flex: 1; }
    ul { list-style: none; padding: 0; }
    #err { color: #b00020; }
  </style>
</head>
<body>
  <h1>Task Manager (3-tier demo)</h1>
  <form id="f">
    <input type="text" id="title" placeholder="New task" required maxlength="200">
    <button type="submit">Add</button>
  </form>
  <p id="err"></p>
  <ul id="list"></ul>

  <script>
    const api = '/api/tasks';
    const list = document.getElementById('list');
    const err = document.getElementById('err');

    async function load() {
      try {
        const res = await fetch(api);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const tasks = await res.json();
        list.innerHTML = '';
        tasks.forEach(t => {
          const li = document.createElement('li');
          if (t.done) li.className = 'done';

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = t.done;
          cb.onchange = () => update(t, cb.checked);

          const span = document.createElement('span');
          span.textContent = t.title;

          const del = document.createElement('button');
          del.textContent = 'Delete';
          del.onclick = () => remove(t.id);

          li.append(cb, span, del);
          list.appendChild(li);
        });
        err.textContent = '';
      } catch (e) {
        err.textContent = 'Could not reach backend: ' + e.message;
      }
    }

    async function update(t, done) {
      await fetch(api + '/' + t.id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: t.title, done })
      });
      load();
    }

    async function remove(id) {
      await fetch(api + '/' + id, { method: 'DELETE' });
      load();
    }

    document.getElementById('f').addEventListener('submit', async e => {
      e.preventDefault();
      const input = document.getElementById('title');
      await fetch(api, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value, done: false })
      });
      input.value = '';
      load();
    });

    load();
  </script>
</body>
</html>
