# CHANGE THESE VALUES before deploying, and do not commit real passwords to Git.
# Better: create the secret from the CLI instead of applying this file:
#   kubectl -n taskapp create secret generic db-credentials \
#     --from-literal=MYSQL_ROOT_PASSWORD='<strong-root-pw>' \
#     --from-literal=DB_USER=appuser \
#     --from-literal=DB_PASSWORD='<strong-app-pw>'
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: taskapp
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "change-me-root"
  DB_USER: "appuser"
  DB_PASSWORD: "change-me-app"
